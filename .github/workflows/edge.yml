# Rolling edge prerelease on main (not tag-triggered — GITHUB_TOKEN tag pushes do not run release.yml).
name: Edge
permissions:
  contents: write

concurrency:
  group: edge-release
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - README.md
      - CLAUDE.md
      - AGENTS.md

jobs:
  plan:
    runs-on: ubuntu-22.04
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      edge-ver: ${{ steps.edge-ver.outputs.edge_ver }}
      edge-tag: ${{ steps.edge-ver.outputs.edge_tag }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - id: edge-ver
        shell: bash
        run: |
          set -euo pipefail
          VER=$(grep '^version = ' Cargo.toml | head -1 | sed -E 's/version = "(.*)"/\1/')
          BASE="$VER"
          if git rev-parse -q --verify "refs/tags/v${VER}" >/dev/null 2>&1; then
            IFS=. read -r maj min patch <<<"$BASE"
            patch=$((patch + 1))
            BASE="${maj}.${min}.${patch}"
          fi
          EDGE_VER="${BASE}-edge.${GITHUB_RUN_NUMBER}"
          EDGE_TAG="v${EDGE_VER}"
          echo "edge_ver=${EDGE_VER}" >> "$GITHUB_OUTPUT"
          echo "edge_tag=${EDGE_TAG}" >> "$GITHUB_OUTPUT"
          sed -i 's/^version = ".*"/version = "'"${EDGE_VER}"'"/' Cargo.toml
          perl -0pi -e 's/(^name = "factory"$\nversion = )"[^"]+"/${1}"'"${EDGE_VER}"'"/m' Cargo.lock
      - name: Install dist
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh"
      - name: Cache dist
        uses: actions/upload-artifact@v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      - id: plan
        run: |
          dist plan --tag="${{ steps.edge-ver.outputs.edge_tag }}" --output-format=json > plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Upload plan-dist-manifest.json
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Patch workspace version for dist
        shell: bash
        run: |
          set -euo pipefail
          EDGE_VER="${{ needs.plan.outputs.edge-ver }}"
          sed -i 's/^version = ".*"/version = "'"${EDGE_VER}"'"/' Cargo.toml
          perl -0pi -e 's/(^name = "factory"$\nversion = )"[^"]+"/${1}"'"${EDGE_VER}"'"/m' Cargo.lock
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      - name: Install dist
        run: ${{ matrix.install_dist.run }}
      - name: Fetch local artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: ${{ matrix.packages_install }}
      - name: Build artifacts
        run: |
          dist build --tag="${{ needs.plan.outputs.edge-tag }}" --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
      - id: cargo-dist
        shell: bash
        run: |
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Patch workspace version for dist
        shell: bash
        run: |
          set -euo pipefail
          EDGE_VER="${{ needs.plan.outputs.edge-ver }}"
          sed -i 's/^version = ".*"/version = "'"${EDGE_VER}"'"/' Cargo.toml
          perl -0pi -e 's/(^name = "factory"$\nversion = )"[^"]+"/${1}"'"${EDGE_VER}"'"/m' Cargo.lock
      - name: Install cached dist
        uses: actions/download-artifact@v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      - name: Fetch local artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          dist build --tag="${{ needs.plan.outputs.edge-tag }}" --output-format=json --artifacts=global > dist-manifest.json
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  publish:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
    if: ${{ always() && needs.plan.result == 'success' && (needs.build-global-artifacts.result == 'success' || needs.build-global-artifacts.result == 'skipped') && (needs.build-local-artifacts.result == 'success' || needs.build-local-artifacts.result == 'skipped') }}
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download GitHub Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: rm -f artifacts/*-dist-manifest.json
      - name: Create GitHub Release
        run: |
          gh release create "${{ needs.plan.outputs.edge-tag }}" \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title "factory ${{ needs.plan.outputs.edge-tag }}" \
            --notes "Rolling edge build from ${GITHUB_SHA}." \
            artifacts/*
      - name: Prune older edge prereleases
        run: |
          set -euo pipefail
          KEEP="${{ needs.plan.outputs.edge-tag }}"
          gh release list --json tagName,isPrerelease | jq -r --arg KEEP "$KEEP" \
            '.[] | select(.isPrerelease) | select(.tagName | test("-edge\\.")) | select(.tagName != $KEEP) | .tagName' | while read -r tag; do
            gh release delete "$tag" --yes --cleanup-tag
          done