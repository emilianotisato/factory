[package]
name = "factory"
version = "0.2.0"
edition = "2024"
publish = false
repository = "https://github.com/emilianotisato/factory"
description = "Drives unattended feature delivery: spawns coding-agent workers with context packs and runs the gate itself"

[lib]
name = "factory"
path = "src/lib.rs"

[[bin]]
name = "factory"
path = "src/main.rs"

# `publish = false` hides the binary from dist otherwise.
[package.metadata.dist]
dist = true

[dependencies]
clap = { version = "4.6", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
libc = "0.2"
sha2 = "0.11"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
ignore = "0.4.33"
tree-sitter = "0.27.1"
tree-sitter-tags = "0.27.1"
tree-sitter-php = "0.25.1"
tree-sitter-go = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
axoupdater = { version = "0.10", features = ["blocking"] }
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
