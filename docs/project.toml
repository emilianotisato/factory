[docs]
framework = 3
gate = "cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test && claude plugin validate mods/cockpit && claude plugin test mods/cockpit"
inner = "cargo fmt && cargo clippy --all-targets -- -D warnings && cargo test -q"
lanes = 4
checkpoint_every = 2
prd_max_kb = 120
slice_max_kb = 30

[lanes]
seed = []

[leaks]
# `all`: test files that narrate their fixture's scenario by the fixture's own slice numbers, and recorded output.
# `strings`: files whose id-shaped strings are data compared with the tool's output or a fixture.
allow = [
  { path = "tests/checkpoints.rs", scope = "all" },
  { path = "tests/closeout.rs", scope = "all" },
  { path = "tests/merge.rs", scope = "all" },
  { path = "tests/quota.rs", scope = "all" },
  { path = "tests/stubs/cursor-review.jsonl", scope = "all" },
  { path = "tests/fixture/v2/", scope = "all" },
  { path = "src/answers.rs" },
  { path = "src/checkpoint.rs" },
  { path = "src/cli/answer.rs" },
  { path = "src/cli/hook.rs" },
  { path = "src/cli/report.rs" },
  { path = "src/cli/review.rs" },
  { path = "src/cli/status.rs" },
